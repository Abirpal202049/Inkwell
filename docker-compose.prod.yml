# Production stack — single GCP Compute Engine VM (plan: GitHub Actions
# builds/pushes images to Artifact Registry, then the VM pulls and
# recreates). On the VM, place a filled-in `.env` (from
# deploy/.env.prod.example) next to this file and run:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Local full-stack test without a registry:
#   docker compose -f docker-compose.prod.yml build
#
# TLS: Caddy terminates HTTPS for ${DOMAIN} (Let's Encrypt, automatic) and
# routes /api/* + /doc to the backend, everything else to the frontend.
# Only Caddy publishes ports; app containers stay on the internal network.

name: inkwell

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkwell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: inkwell
      # Read by deploy/postgres-init/01-app-role.sh on FIRST boot only
      # (empty data volume) to create the non-owner RLS role.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkwell -d inkwell"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: prisma migrate deploy + (re)apply RLS policies, then exits.
  # Runs as the table OWNER (inkwell) — migrations need it, and RLS
  # deliberately doesn't bind to the owner.
  migrate:
    image: ${BACKEND_IMAGE:-inkwell-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inkwell:${POSTGRES_PASSWORD}@postgres:5432/inkwell
      DIRECT_DATABASE_URL: postgresql://inkwell:${POSTGRES_PASSWORD}@postgres:5432/inkwell
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy && npx prisma db execute --file prisma/rls.sql --schema prisma/schema.prisma",
      ]

  backend:
    image: ${BACKEND_IMAGE:-inkwell-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Non-owner app role → the rls.sql policies actually apply.
      DATABASE_URL: postgresql://inkwell_app:${APP_DB_PASSWORD}@postgres:5432/inkwell
      DIRECT_DATABASE_URL: postgresql://inkwell_app:${APP_DB_PASSWORD}@postgres:5432/inkwell
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: https://${DOMAIN}/api/auth
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      COLLAB_JWT_SECRET: ${COLLAB_JWT_SECRET:?set COLLAB_JWT_SECRET in .env}
      # WS upgrade Origin allow-list (backend/src/env.ts).
      FRONTEND_ORIGIN: https://${DOMAIN}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-inkwell-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle — must be the public wss URL.
        NEXT_PUBLIC_COLLAB_WS_URL: wss://${DOMAIN}/doc
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy-data:
  caddy-config:
