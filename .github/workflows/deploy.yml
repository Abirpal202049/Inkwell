# Deploy to the GCP Compute Engine VM (single-VM docker compose stack).
#
# Flow: build both images → push to Artifact Registry → copy compose files
# to the VM over SSH → pull the new images and `compose up -d` → verify
# /healthz through the public domain.
#
# Requires (GitHub → repo Settings → Secrets and variables → Actions):
#   Variables: GCP_PROJECT_ID, GCP_REGION (e.g. asia-south1), DOMAIN
#   Secrets:   GCP_SA_KEY   — JSON key of a service account with
#                             roles/artifactregistry.writer
#              VM_HOST      — the VM's static external IP
#              VM_USER      — SSH user on the VM (in the docker group)
#              VM_SSH_KEY   — private key matching the VM's metadata pubkey

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/inkwell

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & push backend
        run: |
          docker build -f backend/Dockerfile \
            -t $IMAGE_BASE/backend:${{ github.sha }} \
            -t $IMAGE_BASE/backend:latest .
          docker push --all-tags $IMAGE_BASE/backend

      - name: Build & push frontend
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_COLLAB_WS_URL=wss://${{ vars.DOMAIN }}/doc \
            -t $IMAGE_BASE/frontend:${{ github.sha }} \
            -t $IMAGE_BASE/frontend:latest .
          docker push --all-tags $IMAGE_BASE/frontend

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      # The VM only needs the compose file + deploy assets, not the repo —
      # images carry the code. scp preserves the relative paths.
      - name: Copy compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/Caddyfile,deploy/postgres-init/01-app-role.sh"
          target: inkwell

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GCP_SA_KEY,BACKEND_IMAGE,FRONTEND_IMAGE,REGISTRY
          script: |
            set -e
            cd ~/inkwell
            # .env (secrets) is created once by hand on the VM — verify it exists.
            test -f .env || { echo "FATAL: ~/inkwell/.env missing — create it from deploy/.env.prod.example"; exit 1; }
            printf '%s' "$GCP_SA_KEY" | docker login -u _json_key --password-stdin "https://$REGISTRY"
            export BACKEND_IMAGE FRONTEND_IMAGE
            docker compose -f docker-compose.prod.yml pull postgres caddy backend frontend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout "https://$REGISTRY"
            # Keep the disk from filling with superseded images.
            docker image prune -af --filter "until=72h"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          REGISTRY: ${{ env.REGISTRY }}
          BACKEND_IMAGE: ${{ env.IMAGE_BASE }}/backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}

      - name: Health check
        run: |
          echo "Waiting for https://${{ vars.DOMAIN }}/healthz ..."
          for i in $(seq 1 24); do
            if curl -fsS --max-time 5 "https://${{ vars.DOMAIN }}/healthz"; then
              echo; echo "Deploy healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy in time."
          exit 1
